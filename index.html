<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>结论版式对比</title><style>
:root{--bg:#f4f5f7;--card:#fff;--line:#dfe2e8;--ink:#1c2130;--sub:#5d6475;--acc:#2864B9;--accbg:#e9f0fb}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/3;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0}label.chip{border:1px solid var(--line);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer;background:#fff;user-select:none}
label.chip input{display:none}label.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.ctl{margin-left:auto;font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center}
nav{overflow:auto;border-right:1px solid var(--line);background:var(--card);padding:8px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;font:inherit;font-size:13px;line-height:1.5;cursor:pointer;color:var(--ink)}
nav button:hover{background:#f0f2f6}nav button.on{background:var(--accbg);color:var(--acc);font-weight:600}nav small{color:var(--sub);font-weight:400}
main{overflow:auto;padding:14px 16px}h2{font-size:15px;margin:0 0 12px;line-height:1.6}
.row{display:flex;gap:14px;align-items:flex-start;width:max-content;min-width:100%}
.col{flex:0 0 var(--w,640px);background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.col h3{margin:0;padding:10px 12px 4px;font-size:15px}.col dl{margin:0;padding:0 12px 10px;font-size:12.5px;color:var(--sub);display:grid;grid-template-columns:auto 1fr;gap:2px 8px;border-bottom:1px solid var(--line)}
.col dt{white-space:nowrap}.col dd{margin:0;color:var(--ink)}.col img{display:block;width:100%;cursor:zoom-in}.none{padding:40px 12px;color:#999;font-size:13px}
#zoom{position:fixed;inset:0;background:rgba(20,24,36,.82);display:none;overflow:auto;padding:24px;z-index:9;cursor:zoom-out}#zoom img{display:block;margin:0 auto;max-width:1100px;width:100%;background:#fff;border-radius:6px}
#zoom p{color:#fff;text-align:center;margin:0 0 10px;font-size:14px}
@media(max-width:900px){body{grid-template-columns:1fr;height:auto}nav{border-right:0;border-bottom:1px solid var(--line);max-height:180px}}
</style><header><h1>结论版式对比</h1><span id="chips"></span>
<span class="ctl">栏宽 <input id="w" type="range" min="420" max="1100" step="20" value="640"> <span id="wv">640</span>px</span></header>
<nav id="nav"></nav><main><h2 id="q"></h2><div class="row" id="row"></div>
<p style="color:#5d6475;font-size:12.5px;line-height:1.8;max-width:900px">自造数据（游戏、礼包编号、数字均为虚构）。所有栏写结论的都是 内网 GLM 5.3 Flash，由前端真实渲染器出图。
耗时是从发出请求到原稿写完，含网关排队和首字超时后的重试。点图放大，↑↓ 换题。</p></main>
<div id="zoom"><p id="zt"></p><img id="zi"></div>
<script>const D={"variants": [{"id": "old", "name": "旧版", "who": "提示词写死：结论框、指标卡、图、短解读，顺序固定", "main": "不参与", "think": "不思考", "on": true}, {"id": "new_low", "name": "改后 · 不思考", "who": "主流程定内容和主次，结论模型定用什么组件", "main": "hy4", "think": "不思考", "on": true}, {"id": "new_high", "name": "改后 · 高思考", "who": "同上（同一份指导）", "main": "hy4", "think": "高思考（已决定不用）", "on": false}, {"id": "arr_hy4", "name": "主流程定排列 · hy4", "who": "主流程逐块定排列和形式，给了页面能力清单", "main": "hy4", "think": "不思考", "on": false}, {"id": "arr_glm", "name": "主流程定排列 · GLM 5.3", "who": "同上", "main": "GLM 5.3（代替正式中档 GLM 5.4）", "think": "不思考", "on": false}, {"id": "v4", "name": "第四版（已否）", "who": "主流程定排列和形式，只给了组件名字", "main": "hy4", "think": "不思考", "on": false}, {"id": "color_text", "name": "排列+颜色交给主流程 · 原型", "who": "主流程定排列和颜色，颜色经结论模型转写（常漏、会写坏）", "main": "hy4", "think": "不思考", "on": false}], "cases": [{"id": "packs", "q": "还有5200-5230以及4860（续问：再看一批礼包的购买和转化；一块数据 15 行 9 列）", "shots": {"old": {"img": "img/packs__old.png", "sec": null}, "new_low": {"img": "img/packs__new_low.png", "sec": null}, "arr_hy4": {"img": "img/packs__arr_hy4.png", "sec": null}, "v4": {"img": "img/packs__v4.png", "sec": null}, "color_text": {"img": "img/packs__color_text.png", "sec": null}}}, {"id": "count", "q": "昨天云顶牌局的回归用户数是多少", "shots": {"old": {"img": "img/count__old.png", "sec": 15}, "new_low": {"img": "img/count__new_low.png", "sec": 2}, "new_high": {"img": "img/count__new_high.png", "sec": 4}, "arr_hy4": {"img": "img/count__arr_hy4.png", "sec": null}, "arr_glm": {"img": "img/count__arr_glm.png", "sec": null}}}, {"id": "compare", "q": "云顶牌局近7天充值金额对比前7天怎么样", "shots": {"old": {"img": "img/compare__old.png", "sec": 12}, "new_low": {"img": "img/compare__new_low.png", "sec": 14}, "arr_hy4": {"img": "img/compare__arr_hy4.png", "sec": null}, "arr_glm": {"img": "img/compare__arr_glm.png", "sec": null}, "color_text": {"img": "img/compare__color_text.png", "sec": null}}}, {"id": "why", "q": "云顶牌局 11月23日首充用户数为什么掉了", "shots": {"old": {"img": "img/why__old.png", "sec": 15}, "new_low": {"img": "img/why__new_low.png", "sec": 16}, "new_high": {"img": "img/why__new_high.png", "sec": 23}, "arr_hy4": {"img": "img/why__arr_hy4.png", "sec": null}, "arr_glm": {"img": "img/why__arr_glm.png", "sec": null}, "color_text": {"img": "img/why__color_text.png", "sec": null}}}, {"id": "dist", "q": "星辉杯最近8天，用户按当日对局数分档的人数和占比是怎样的", "shots": {"old": {"img": "img/dist__old.png", "sec": 3}, "new_low": {"img": "img/dist__new_low.png", "sec": 6}, "new_high": {"img": "img/dist__new_high.png", "sec": 90}, "arr_hy4": {"img": "img/dist__arr_hy4.png", "sec": null}, "arr_glm": {"img": "img/dist__arr_glm.png", "sec": null}, "color_text": {"img": "img/dist__color_text.png", "sec": null}}}, {"id": "detail", "q": "把玩家 80231764 近10天每天参与了哪些活动模块列个表给我", "shots": {"old": {"img": "img/detail__old.png", "sec": 8}, "new_low": {"img": "img/detail__new_low.png", "sec": 4}, "new_high": {"img": "img/detail__new_high.png", "sec": 20}}}, {"id": "explain", "q": "上面的付费率是怎么算的", "shots": {"old": {"img": "img/explain__old.png", "sec": 13}, "new_low": {"img": "img/explain__new_low.png", "sec": 1}, "new_high": {"img": "img/explain__new_high.png", "sec": 80}, "arr_hy4": {"img": "img/explain__arr_hy4.png", "sec": null}, "arr_glm": {"img": "img/explain__arr_glm.png", "sec": null}}}, {"id": "fix", "q": "上一轮的人均充值算错了，应该除以充值用户数而不是登录用户数，重算一下", "shots": {"old": {"img": "img/fix__old.png", "sec": 18}, "new_low": {"img": "img/fix__new_low.png", "sec": 10}, "new_high": {"img": "img/fix__new_high.png", "sec": 36}, "arr_hy4": {"img": "img/fix__arr_hy4.png", "sec": null}, "arr_glm": {"img": "img/fix__arr_glm.png", "sec": null}}}, {"id": "ask_cards", "q": "云顶牌局近7天充值金额对比前7天怎么样，用指标卡加柱状图给我看，不要表", "shots": {"old": {"img": "img/ask_cards__old.png", "sec": 40}, "new_low": {"img": "img/ask_cards__new_low.png", "sec": 9}, "new_high": {"img": "img/ask_cards__new_high.png", "sec": 87}}}, {"id": "ask_table", "q": "云顶牌局 11月23日首充用户数为什么掉了，直接给我一张表说清楚，不要图", "shots": {"old": {"img": "img/ask_table__old.png", "sec": 7}, "new_low": {"img": "img/ask_table__new_low.png", "sec": 3}, "new_high": {"img": "img/ask_table__new_high.png", "sec": 8}}}, {"id": "postmortem", "q": "云顶牌局双十一充值返利活动（11月11日到17日）效果怎么样，帮我复盘一下", "shots": {"old": {"img": "img/postmortem__old.png", "sec": 38}, "new_low": {"img": "img/postmortem__new_low.png", "sec": 7}, "new_high": {"img": "img/postmortem__new_high.png", "sec": 328}, "arr_hy4": {"img": "img/postmortem__arr_hy4.png", "sec": null}, "arr_glm": {"img": "img/postmortem__arr_glm.png", "sec": null}}}, {"id": "weekly", "q": "这周云顶牌局大盘怎么样，跟上周比呢", "shots": {"old": {"img": "img/weekly__old.png", "sec": 2}, "new_low": {"img": "img/weekly__new_low.png", "sec": 8}, "new_high": {"img": "img/weekly__new_high.png", "sec": 134}, "arr_hy4": {"img": "img/weekly__arr_hy4.png", "sec": null}, "arr_glm": {"img": "img/weekly__arr_glm.png", "sec": null}, "color_text": {"img": "img/weekly__color_text.png", "sec": null}}}, {"id": "redef", "q": "活跃用户改成按当天有对局的算，不要按登录算，其他不变，上周的数再出一版", "shots": {"old": {"img": "img/redef__old.png", "sec": 21}, "new_low": {"img": "img/redef__new_low.png", "sec": 12}, "new_high": {"img": "img/redef__new_high.png", "sec": 98}}}, {"id": "partial", "q": "上周云顶牌局各渠道新增用户的7日LTV是多少，哪个渠道回本最快", "shots": {"old": {"img": "img/partial__old.png", "sec": 21}, "new_low": {"img": "img/partial__new_low.png", "sec": 11}, "new_high": {"img": "img/partial__new_high.png", "sec": 60}}}, {"id": "ask_report", "q": "云顶牌局双十一充值返利活动（11月11日到17日）效果怎么样，帮我复盘一下。给我一份完整的复盘报告，相关的图和明细都放上", "shots": {"old": {"img": "img/ask_report__old.png", "sec": 29}, "new_low": {"img": "img/ask_report__new_low.png", "sec": 37}, "new_high": {"img": "img/ask_report__new_high.png", "sec": 251}}}], "writer": "内网 GLM 5.3 Flash"};let cur=0;const on=new Set(D.variants.filter(v=>v.on).map(v=>v.id));
const $=id=>document.getElementById(id);
function chips(){$('chips').innerHTML=D.variants.map(v=>`<label class="chip ${on.has(v.id)?'on':''}"><input type="checkbox" data-v="${v.id}" ${on.has(v.id)?'checked':''}>${v.name}</label>`).join(' ');
$('chips').querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?on.add(i.dataset.v):on.delete(i.dataset.v);chips();draw()})}
function nav(){$('nav').innerHTML=D.cases.map((c,i)=>`<button class="${i==cur?'on':''}" data-i="${i}">${i+1}. ${c.q}<br><small>${Object.keys(c.shots).length} 个方案有结果</small></button>`).join('');
$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;nav();draw()})}
function draw(){const c=D.cases[cur];$('q').textContent='提问：'+c.q;
$('row').innerHTML=D.variants.filter(v=>on.has(v.id)).map(v=>{const s=c.shots[v.id];
return `<section class="col"><h3>${v.name}</h3><dl><dt>版面</dt><dd>${v.who}</dd><dt>主流程</dt><dd>${v.main}</dd><dt>思考</dt><dd>${v.think}${s&&s.sec!=null?'　·　出稿 '+s.sec+' 秒':''}</dd></dl>`+
(s?`<img src="${s.img}" data-t="${v.name}" loading="lazy">`:'<div class="none">这道题没有跑这个方案</div>')+'</section>'}).join('');
$('row').querySelectorAll('img').forEach(im=>im.onclick=()=>{$('zi').src=im.src;$('zt').textContent=im.dataset.t+'　·　'+c.q;$('zoom').style.display='block'})}
$('zoom').onclick=()=>$('zoom').style.display='none';
$('w').oninput=e=>{document.documentElement.style.setProperty('--w',e.target.value+'px');$('wv').textContent=e.target.value};
document.onkeydown=e=>{if(e.key=='Escape')$('zoom').style.display='none';if(e.key=='ArrowDown'||e.key=='ArrowUp'){cur=Math.max(0,Math.min(D.cases.length-1,cur+(e.key=='ArrowDown'?1:-1)));nav();draw();e.preventDefault()}};
chips();nav();draw();</script></html>
